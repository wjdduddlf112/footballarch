name: Verify PL 2023-24 DRAFT
on:
  push:
    branches: [main, draft/pl-2023-24-research]
    paths:
      - data/premierleague-2023-24.json
      - audit/player-research/premierleague-2023-24-*
      - scripts/verify-pl-2023-24-draft.mjs
      - .github/workflows/verify-pl-2023-24-draft.yml
  pull_request:
    paths:
      - data/premierleague-2023-24.json
      - audit/player-research/premierleague-2023-24-*
      - scripts/verify-pl-2023-24-draft.mjs
      - .github/workflows/verify-pl-2023-24-draft.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-pl-2023-24-draft.mjs
