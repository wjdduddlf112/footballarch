name: Verify Football Archive PL 2020-21 DRAFT
on:
  push:
    paths:
      - "data/premierleague-2020-21.json"
      - "audit/player-research/premierleague-2020-21-*"
      - "audit/PLAYER_PREMIERLEAGUE_2020-21_DRAFT_REVIEW.md"
      - "scripts/verify-pl-2020-21-draft.mjs"
      - ".github/workflows/verify-pl-2020-21-draft.yml"
  pull_request:
    paths:
      - "data/premierleague-2020-21.json"
      - "audit/player-research/premierleague-2020-21-*"
      - "audit/PLAYER_PREMIERLEAGUE_2020-21_DRAFT_REVIEW.md"
      - "scripts/verify-pl-2020-21-draft.mjs"
      - ".github/workflows/verify-pl-2020-21-draft.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-pl-2020-21-draft.mjs
