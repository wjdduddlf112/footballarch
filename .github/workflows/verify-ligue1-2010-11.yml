name: Verify Ligue 1 2010-11 draft
on:
  push:
    paths:
      - "data/ligue1-2010-11.json"
      - "scripts/verify-ligue1-2010-11.mjs"
      - ".github/workflows/verify-ligue1-2010-11.yml"
  workflow_dispatch:
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-ligue1-2010-11.mjs
