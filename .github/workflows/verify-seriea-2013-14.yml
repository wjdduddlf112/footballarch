name: Verify Serie A 2013-14 DRAFT
on:
  push:
    paths:
      - 'data/seriea-2013-14.json'
      - 'scripts/verify-seriea-2013-14.mjs'
      - '.github/workflows/verify-seriea-2013-14.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 2013-14 Serie A DRAFT integrity audit
        run: node scripts/verify-seriea-2013-14.mjs
