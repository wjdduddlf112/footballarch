name: Recover stuck Football Archive Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect and release only the identified blocked Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED_DEPLOY_SHA: f93800163ed4d203fe2f8df0b53072427c1cb5b3
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/pages/deployments/${BLOCKED_DEPLOY_SHA}"
          if ! gh api "${endpoint}" > /tmp/pages-deployment.json; then
            echo "The previously blocked deployment is unavailable or no longer exists; no cancellation performed."
            exit 0
          fi
          status="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/pages-deployment.json","utf8")).status')"
          echo "Previously blocked deployment ${BLOCKED_DEPLOY_SHA} status: ${status}"
          # Cancel only a truly active deployment. A GitHub Pages backend lock may
          # inconsistently reject new publishes even when GET reports "succeed";
          # in that case this endpoint returns HTTP 400 and cannot clear the lock.
          case "${status}" in
            in_progress|pending|queued)
              gh api -X POST "${endpoint}/cancel"
              echo "Requested cancellation of the identified active deployment."
              ;;
            *)
              echo "Deployment reports ${status}; no destructive action taken."
              echo "If newer Pages deployments still return 'in progress', the backend state requires GitHub resolution."
              ;;
          esac
