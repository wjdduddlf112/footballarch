name: Recover stuck Football Archive Pages deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stuck-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect and release only the identified blocked Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED_DEPLOY_SHA: f93800163ed4d203fe2f8df0b53072427c1cb5b3
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/pages/deployments/${BLOCKED_DEPLOY_SHA}"
          if ! gh api "${endpoint}" > /tmp/pages-deployment.json; then
            echo "The previously blocked deployment is unavailable or no longer exists; no cancellation performed."
            exit 0
          fi
          status="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/pages-deployment.json","utf8")).status')"
          echo "Previously blocked deployment ${BLOCKED_DEPLOY_SHA} status: ${status}"
          # GitHub reported "succeed" from this status API while the very next
          # deploy-pages@v5 request still rejected THIS SAME SHA as "in progress".
          # Explicitly call its official cancel endpoint once to clear the stale lock.
          echo "GitHub Pages still rejects new publishes as in progress for ${BLOCKED_DEPLOY_SHA} even when status says ${status}."
          gh api -X POST "${endpoint}/cancel"
          echo "Submitted explicit cancellation for the uniquely identified blocking deployment."
