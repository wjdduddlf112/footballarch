name: Verify Football Archive PL 2011-12 DRAFT
on:
  push:
    paths:
      - "data/premierleague-2011-12.json"
      - "scripts/verify-pl-2011-12-draft.mjs"
      - ".github/workflows/verify-pl-2011-12-draft.yml"
  pull_request:
    paths:
      - "data/premierleague-2011-12.json"
      - "scripts/verify-pl-2011-12-draft.mjs"
      - ".github/workflows/verify-pl-2011-12-draft.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Premier League 2011-12 data integrity
        run: node scripts/verify-pl-2011-12-draft.mjs
