name: Verify UEFA 2013-14 DRAFT and LIVE Pages
on:
  push:
    branches: [main]
    paths:
      - 'data/ucl-2013-14.json'
      - 'data/uel-2013-14.json'
      - 'assets/app.js'
      - 'index.html'
      - 'scripts/verify-uefa-2013-14-draft.mjs'
      - 'scripts/verify-uefa-2013-14-live.mjs'
      - '.github/workflows/verify-uefa-2013-14-draft-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and historical match-table structural validation
        run: |
          node --check assets/app.js
          node scripts/verify-uefa-2013-14-draft.mjs
  live-browser:
    needs: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate public Pages for UCL and UEL 2013-14 and 2012-13
        run: node scripts/verify-uefa-2013-14-live.mjs
