name: Bundesliga 2011-12 historical DRAFT checks

on:
  push:
    branches: [main]
    paths:
      - data/bundesliga-2011-12.json
      - scripts/validate_bundesliga_2011_12.py
      - scripts/browser_smoke_bundesliga_2011_12.cjs
      - assets/app.js
      - .github/workflows/validate-bundesliga-2011-12.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: 2011-12 JSON structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all 126 player records and 6 qualified clubs
        run: python scripts/validate_bundesliga_2011_12.py

  browser:
    name: LIVE Football Archive browser smoke and 2010-11 regression
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright in CI workspace
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test published 2011-12 pages and earlier season regression
        run: node scripts/browser_smoke_bundesliga_2011_12.cjs
