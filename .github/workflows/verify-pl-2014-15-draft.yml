name: Verify Football Archive PL 2014-15 DRAFT
on:
  push:
    paths:
      - "data/premierleague-2014-15.json"
      - "audit/player-research/premierleague-2014-15-*"
      - "scripts/verify-pl-2014-15-draft.mjs"
      - ".github/workflows/verify-pl-2014-15-draft.yml"
  pull_request:
    paths:
      - "data/premierleague-2014-15.json"
      - "audit/player-research/premierleague-2014-15-*"
      - "scripts/verify-pl-2014-15-draft.mjs"
      - ".github/workflows/verify-pl-2014-15-draft.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-pl-2014-15-draft.mjs
