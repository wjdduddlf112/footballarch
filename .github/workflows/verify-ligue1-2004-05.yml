name: Verify Ligue 1 2004-05 DRAFT (structure, local and public Chromium)
on:
  push:
    paths:
      - 'data/ligue1-2004-05.json'
      - 'scripts/verify-ligue1-2004-05.mjs'
      - 'scripts/verify-ligue1-2004-05-browser.mjs'
      - '.github/workflows/verify-ligue1-2004-05.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 2004-05 roster and rankings
        run: node scripts/verify-ligue1-2004-05.mjs
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          nohup python3 -m http.server 8871 --bind 127.0.0.1 > /tmp/ligue1-2004-05-server.log 2>&1 &
          sleep 3
      - name: Check local Football Archive page
        env:
          TARGET_URL: http://127.0.0.1:8871/?league=ligue1&season=2004-05
          EXPECTED_PLAYERS: '150'
        run: node scripts/verify-ligue1-2004-05-browser.mjs
      - name: Check published GitHub Pages page
        env:
          TARGET_URL: https://wjdduddlf112.github.io/footballarch/?league=ligue1&season=2004-05
          EXPECTED_PLAYERS: '150'
        run: |
          for attempt in $(seq 1 30); do
            if node scripts/verify-ligue1-2004-05-browser.mjs; then exit 0; fi
            sleep 12
          done
          exit 1
