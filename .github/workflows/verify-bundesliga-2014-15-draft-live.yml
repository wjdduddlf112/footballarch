name: Verify Bundesliga 2014-15 draft and live Pages
on:
  push:
    branches: [main]
    paths:
      - data/bundesliga-2014-15.json
      - scripts/verify-bundesliga-2014-15-draft.mjs
      - scripts/verify-bundesliga-2014-15-live.mjs
      - .github/workflows/verify-bundesliga-2014-15-draft-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check historical DRAFT structure
        run: node scripts/verify-bundesliga-2014-15-draft.mjs
  browser:
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real deployed site smoke plus 2013-14 regression
        run: node scripts/verify-bundesliga-2014-15-live.mjs
