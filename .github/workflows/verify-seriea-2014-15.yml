name: Verify Serie A 2014-15 DRAFT
on:
  push:
    paths:
      - 'data/seriea-2014-15.json'
      - 'scripts/verify-seriea-2014-15.mjs'
      - '.github/workflows/verify-seriea-2014-15.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Serie A 2014-15 draft structure
        run: node scripts/verify-seriea-2014-15.mjs
