name: Ligue 1 segment 3 audit verification
on:
  pull_request:
    paths:
      - 'data/ligue1-*.json'
      - 'scripts/verify-ligue1-*.mjs'
      - 'assets/app.js'
      - '.github/workflows/verify-ligue1-segment3.yml'
  push:
    branches: [main, 'audit/ligue1-2017-18-2025-26']
    paths:
      - 'data/ligue1-*.json'
      - 'scripts/verify-ligue1-*.mjs'
      - 'assets/app.js'
      - '.github/workflows/verify-ligue1-segment3.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate nine season structures
        run: |
          set -e
          node --check assets/app.js
          for season in 2017-18 2018-19 2019-20 2020-21 2021-22 2022-23 2023-24 2024-25 2025-26; do
            node "scripts/verify-ligue1-${season}.mjs"
          done
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          nohup python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/l1-segment3.log 2>&1 &
          sleep 3
      - name: Verify nine local season screens and data
        run: node scripts/verify-ligue1-segment3-browser.mjs
      - name: Verify production Pages exact data and screens
        if: github.ref == 'refs/heads/main'
        env:
          TARGET_BASE: https://wjdduddlf112.github.io/footballarch
          LIVE: '1'
        run: node scripts/verify-ligue1-segment3-browser.mjs
