name: Verify Ligue 1 2022-23 DRAFT structure and local/live browsers
on:
  push:
    paths:
      - 'data/ligue1-2022-23.json'
      - 'scripts/verify-ligue1-2022-23.mjs'
      - 'scripts/verify-ligue1-2022-23-browser.mjs'
      - '.github/workflows/verify-ligue1-2022-23.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural validation and JS syntax
        run: |
          node scripts/verify-ligue1-2022-23.mjs
          node --check assets/app.js
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          nohup python3 -m http.server 8878 --bind 127.0.0.1 >/tmp/ligue1-2022-23.log 2>&1 &
          sleep 3
      - name: Check local browser
        env:
          TARGET_URL: http://127.0.0.1:8878/?league=ligue1&season=2022-23
        run: node scripts/verify-ligue1-2022-23-browser.mjs
      - name: Confirm public Pages revision
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://wjdduddlf112.github.io/footballarch/data/ligue1-2022-23.json?v=2022-23" |
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const d=JSON.parse(s);process.exit(d.meta?.status==="draft"&&d.players?.length===111?0:1)}catch(e){process.exit(1)}})'; then
              echo "Public Pages 111-player DRAFT confirmed"; exit 0
            fi
            sleep 10
          done
          echo "Pages deployment not verified"; exit 1
      - name: Check public browser
        env:
          TARGET_URL: https://wjdduddlf112.github.io/footballarch/?league=ligue1&season=2022-23
        run: node scripts/verify-ligue1-2022-23-browser.mjs
