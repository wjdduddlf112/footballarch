name: Verify Ligue 1 1999-00 draft
on:
  push:
    paths:
      - 'data/ligue1-1999-00.json'
      - 'scripts/verify-ligue1-1999-00.mjs'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-ligue1-1999-00.mjs
