name: Verify Football Archive Bundesliga 2005-06 DRAFT & LIVE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-bundesliga-2005-06-draft-live.yml'
      - 'index.html'
      - 'assets/**'
      - 'data/bundesliga-2005-06.json'
      - 'scripts/verify-bundesliga-2005-06-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-draft-and-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate JavaScript and season structure
        run: |
          node --check assets/app.js
          node --check scripts/verify-bundesliga-2005-06-draft.mjs
          node --check scripts/verify-bundesliga-2005-06-live.mjs
          node scripts/verify-bundesliga-2005-06-draft.mjs
          node scripts/verify-bundesliga.mjs
          node scripts/verify-player-integration.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify latest JSON on real GitHub Pages and check all rendered tiers
        run: |
          for attempt in $(seq 1 12); do
            curl -fsSL --max-time 20 "https://wjdduddlf112.github.io/footballarch/data/bundesliga-2005-06.json?sha=${{ github.sha }}" -o /tmp/bundesliga03-live.json || true
            if node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync('/tmp/bundesliga03-live.json','utf8'));const p=d.players;if(d.meta.status!=='draft'||p.length!==136||p.filter(x=>x.tier).length!==136||p.filter(x=>x.rank).length!==136||d.bestXi.length!==11||d.meta.formation!=='4-4-2')process.exit(1)" 2>/dev/null; then
              echo "GitHub Pages is serving the 136-player 2005-06 draft."
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "Failed to observe deployed GitHub Pages 2005-06 season draft."
              exit 1
            fi
            sleep 20
          done
          node scripts/verify-bundesliga-2005-06-live.mjs
        env:
          SITE_URL: https://wjdduddlf112.github.io/footballarch/
      - name: Upload screenshot evidence and verification JSON
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bundesliga-2005-06-pages-live-audit
          path: audit-artifacts/bundesliga-2005-06-live/
          if-no-files-found: warn
