name: Verify PL 2025-26 DRAFT
on:
  push:
    branches: [main, draft/pl-2025-26-research]
    paths:
      - data/premierleague-2025-26.json
      - audit/player-research/premierleague-2025-26-*
      - scripts/verify-pl-2025-26-draft.mjs
      - .github/workflows/verify-pl-2025-26-draft.yml
  pull_request:
    paths:
      - data/premierleague-2025-26.json
      - audit/player-research/premierleague-2025-26-*
      - scripts/verify-pl-2025-26-draft.mjs
      - .github/workflows/verify-pl-2025-26-draft.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-pl-2025-26-draft.mjs
