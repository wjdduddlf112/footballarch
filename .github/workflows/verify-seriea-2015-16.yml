name: Verify Serie A 2015-16 DRAFT
on:
  push:
    paths:
      - 'data/seriea-2015-16.json'
      - 'scripts/verify-seriea-2015-16.mjs'
      - '.github/workflows/verify-seriea-2015-16.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Serie A 2015-16 DRAFT season schema
        run: node scripts/verify-seriea-2015-16.mjs
