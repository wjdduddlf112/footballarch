name: Verify Serie A 2024-25 DRAFT and browser
on:
  push:
    branches: [main]
    paths:
      - 'data/seriea-2024-25.json'
      - 'scripts/verify-seriea-2024-25.mjs'
      - 'scripts/verify-seriea-2024-25-browser.mjs'
      - 'scripts/verify-seriea-2024-25-live.mjs'
      - '.github/workflows/verify-seriea-2024-25.yml'
  workflow_dispatch:
jobs:
  structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Serie A 2024-25 player JSON and historical standings
        run: |
          node scripts/verify-seriea-2024-25.mjs
          node scripts/verify-seriea.mjs
  browser:
    needs: structure
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test local site tabs, player modal, season JSON in browser
        run: node scripts/verify-seriea-2024-25-browser.mjs
      - name: Test public GitHub Pages 2024-25 real browser
        run: node scripts/verify-seriea-2024-25-live.mjs
      - name: Preserve public browser evidence image
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seriea-2024-25-public-browser
          path: /tmp/seriea-2024-25-live-player.png
          if-no-files-found: ignore
