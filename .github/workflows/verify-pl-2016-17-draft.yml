name: Verify Football Archive PL 2016-17 DRAFT
on:
  push:
    paths:
      - "data/premierleague-2016-17.json"
      - "audit/player-research/premierleague-2016-17-*"
      - "audit/PLAYER_PREMIERLEAGUE_2016-17_DRAFT_REVIEW.md"
      - "scripts/verify-pl-2016-17-draft.mjs"
      - ".github/workflows/verify-pl-2016-17-draft.yml"
  pull_request:
    paths:
      - "data/premierleague-2016-17.json"
      - "audit/player-research/premierleague-2016-17-*"
      - "audit/PLAYER_PREMIERLEAGUE_2016-17_DRAFT_REVIEW.md"
      - "scripts/verify-pl-2016-17-draft.mjs"
      - ".github/workflows/verify-pl-2016-17-draft.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-pl-2016-17-draft.mjs
