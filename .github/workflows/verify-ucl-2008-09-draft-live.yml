name: Verify UCL 2008-09 DRAFT and LIVE Pages
on:
  push:
    branches: [main]
    paths:
      - data/ucl-2008-09.json
      - assets/app.js
      - scripts/verify-ucl-2008-09-draft.mjs
      - scripts/verify-ucl-2008-09-live.mjs
      - .github/workflows/verify-ucl-2008-09-draft-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 32 clubs, 125 matches, standings, 292 UEFA appearances, 16 XIs
        run: node scripts/verify-ucl-2008-09-draft.mjs
  live:
    needs: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test UCL 2008-09 Pages and 2007-08 regression
        run: node scripts/verify-ucl-2008-09-live.mjs
