name: Verify UEFA 2017-18 DRAFT and LIVE Pages
on:
  push:
    branches: [main]
    paths:
      - 'data/ucl-2017-18.json'
      - 'data/uel-2017-18.json'
      - 'assets/app.js'
      - 'index.html'
      - 'scripts/verify-uefa-2017-18-draft.mjs'
      - 'scripts/verify-uefa-2017-18-live.mjs'
      - '.github/workflows/verify-uefa-2017-18-draft-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural and data-consistency validation (historical player audit not claimed)
        run: |
          node --check assets/app.js
          node scripts/verify-uefa-2017-18-draft.mjs
  live-browser:
    needs: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate 2017-18 Pages and 2016-17 regression
        run: node scripts/verify-uefa-2017-18-live.mjs
