name: Verify Football Archive PL 1999-00 DRAFT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-draft-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax and DRAFT data
        run: |
          node --check assets/app.js
          node scripts/verify-pl-1999-00-draft.mjs
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify deployed GitHub Pages
        env:
          SITE_URL: https://wjdduddlf112.github.io/footballarch/
        run: |
          for attempt in $(seq 1 12); do
            curl -fsSL --max-time 20 "https://wjdduddlf112.github.io/footballarch/data/premierleague-1999-00.json?sha=${{ github.sha }}" -o /tmp/pl99-live.json || true
            if node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync('/tmp/pl99-live.json','utf8'));if(d.meta.status!=='draft'||d.players.length!==125||d.bestXi.length!==11)process.exit(1)" 2>/dev/null; then
              echo "Live GitHub Pages JSON matches expected DRAFT."
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "GitHub Pages did not serve expected DRAFT after repeated checks."
              exit 1
            fi
            sleep 20
          done
          node scripts/verify-pl-1999-00-live.mjs
      - name: Upload actual browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-1999-00-pages-live-audit
          path: audit-artifacts/pl-1999-00-live/
          if-no-files-found: warn
