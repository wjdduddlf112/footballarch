name: Verify Serie A 2017-18 DRAFT
on:
  push:
    paths:
      - 'data/seriea-2017-18.json'
      - 'scripts/verify-seriea-2017-18.mjs'
      - '.github/workflows/verify-seriea-2017-18.yml'
  workflow_dispatch:
jobs:
  structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 2017-18 Serie A DRAFT structure
        run: node scripts/verify-seriea-2017-18.mjs
