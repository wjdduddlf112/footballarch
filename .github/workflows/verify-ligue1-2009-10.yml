name: Verify Ligue 1 2009-10 DRAFT (structure + local/public Chromium)
on:
  push:
    paths:
      - 'data/ligue1-2009-10.json'
      - 'scripts/verify-ligue1-2009-10.mjs'
      - 'scripts/verify-ligue1-2009-10-browser.mjs'
      - '.github/workflows/verify-ligue1-2009-10.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check six qualifying clubs all positions/tier/rank integrity
        run: node scripts/verify-ligue1-2009-10.mjs
      - name: Check website JavaScript syntax
        run: node --check assets/app.js
      - name: Install Chromium via Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site for Chromium test
        run: |
          nohup python3 -m http.server 8871 --bind 127.0.0.1 >/tmp/l1-2009-10.log 2>&1 &
          sleep 3
      - name: Run Chromium on local site with complete 2009-10 UI
        env:
          TARGET_URL: http://127.0.0.1:8871/?league=ligue1&season=2009-10
          EXPECTED_PLAYERS: '106'
        run: node scripts/verify-ligue1-2009-10-browser.mjs
      - name: Wait until public Pages serves 2009-10 106-player DRAFT JSON
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://wjdduddlf112.github.io/footballarch/data/ligue1-2009-10.json?v=${GITHUB_SHA}" |
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const d=JSON.parse(s);process.exit(d.meta?.season==="2009-10"&&d.meta?.status==="draft"&&d.players?.length===106?0:1)}catch(e){process.exit(1)}})'; then
              echo "Public Pages currently serves new 2009-10 DRAFT JSON"; exit 0
            fi
            sleep 10
          done
          echo "Public Pages not yet deployed to required season JSON state"; exit 1
      - name: Run public GitHub Pages Chromium end-to-end
        env:
          TARGET_URL: https://wjdduddlf112.github.io/footballarch/?league=ligue1&season=2009-10
          EXPECTED_PLAYERS: '106'
        run: node scripts/verify-ligue1-2009-10-browser.mjs
