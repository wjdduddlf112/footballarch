name: Verify Ligue 1 2006-07 DRAFT — structure and Chromium
on:
  push:
    paths:
      - 'data/ligue1-2006-07.json'
      - 'audit/LIGUE1_2006-07_PRODUCTION_VALIDATION.json'
      - 'scripts/verify-ligue1-2006-07.mjs'
      - 'scripts/verify-ligue1-2006-07-browser.mjs'
      - '.github/workflows/verify-ligue1-2006-07.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Ligue 1 2006-07 historical roster structural rules
        run: node scripts/verify-ligue1-2006-07.mjs
      - name: Check website JavaScript syntax
        run: node --check assets/app.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup python3 -m http.server 8871 --bind 127.0.0.1 >/tmp/l1-2006-07.log 2>&1 &
          sleep 3
      - name: Check local Football Archive 2006-07
        env:
          TARGET_URL: http://127.0.0.1:8871/?league=ligue1&season=2006-07
          EXPECTED_PLAYERS: '125'
        run: node scripts/verify-ligue1-2006-07-browser.mjs
      - name: Check public GitHub Pages 2006-07
        env:
          TARGET_URL: https://wjdduddlf112.github.io/footballarch/?league=ligue1&season=2006-07
          EXPECTED_PLAYERS: '125'
        run: node scripts/verify-ligue1-2006-07-browser.mjs
