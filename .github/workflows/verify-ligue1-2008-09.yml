name: Verify Ligue 1 2008-09 DRAFT (structure, local & public Chromium)
on:
  push:
    paths:
      - 'data/ligue1-2008-09.json'
      - 'scripts/verify-ligue1-2008-09.mjs'
      - 'scripts/verify-ligue1-2008-09-browser.mjs'
      - '.github/workflows/verify-ligue1-2008-09.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 2008-09 full roster structure and rankings
        run: node scripts/verify-ligue1-2008-09.mjs
      - name: Check website JavaScript syntax
        run: node --check assets/app.js
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup python3 -m http.server 8871 --bind 127.0.0.1 >/tmp/ligue1-2008-09.log 2>&1 &
          sleep 3
      - name: Check local Chromium UI 2008-09
        env:
          TARGET_URL: http://127.0.0.1:8871/?league=ligue1&season=2008-09
          EXPECTED_PLAYERS: '94'
        run: node scripts/verify-ligue1-2008-09-browser.mjs
      - name: Wait until Pages serves this version (avoid deployment race)
        run: |
          for attempt in $(seq 1 50); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://wjdduddlf112.github.io/footballarch/data/ligue1-2008-09.json?v=${GITHUB_SHA}" |
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const d=JSON.parse(s);process.exit(d.meta?.season==="2008-09"&&d.meta?.status==="draft"&&d.players?.length===94?0:1)}catch(e){process.exit(1)}})'; then
              echo "Latest public Pages JSON confirmed"; exit 0
            fi
            sleep 12
          done
          echo "Pages did not publish 2008-09 draft within verification window"; exit 1
      - name: Check public GitHub Pages Chromium UI
        env:
          TARGET_URL: https://wjdduddlf112.github.io/footballarch/?league=ligue1&season=2008-09
          EXPECTED_PLAYERS: '94'
        run: node scripts/verify-ligue1-2008-09-browser.mjs
